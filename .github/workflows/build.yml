name: Build fork images

# Builds container images from wxrchn's forks (default branches) and pushes
# them to GHCR under ghcr.io/wxrchn/*. Runs weekly on Mondays 02:00 UTC
# (10:00 Asia/Shanghai), after the weekly fork sync, or manually.
# Skip rule (wxr, 2026-11-02): an image whose source has not changed since
# the last build/mirror is skipped - no new commits, no rebuild.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  packages: write

# Stamped on every built image together with the source commit SHA. The
# build job skips a fork whose current HEAD still matches the stamp on its
# existing image. Bump BUILD_RECIPE whenever the build logic in this file
# changes in a way that alters the output image.
env:
  BUILD_RECIPE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: 3x-ui, branch: main, file: Dockerfile, image: 3x-ui }
          - { repo: LunaTV, branch: main, file: Dockerfile, image: lunatv }
          # dockge: its Dockerfile never builds the frontend - upstream compiles
          # frontend-dist on the host before docker build, so `pre` does the same
          # (found 2026-11-02: images built without it had no web UI at all).
          # target release matches the version tags (default would be nightly);
          # variant is a per-image stamp so changing this entry rebuilds only dockge.
          - { repo: dockge, branch: master, file: docker/Dockerfile, image: dockge, target: release, variant: fe-release-1, pre: "npm clean-install --no-fund && npm run build:frontend" }
          - { repo: filebrowser, branch: main, file: _docker/Dockerfile, image: filebrowser }
          - { repo: frp, branch: dev, file: dockerfiles/Dockerfile-for-frpc, image: frpc }
          - { repo: frp, branch: dev, file: dockerfiles/Dockerfile-for-frps, image: frps }
          # memos: its Dockerfile expects the frontend to be built first (the
          # binary embeds server/frontend/dist; a clean checkout only has a
          # placeholder page there - found 2026-11-02). `pre` runs the web
          # package's own release build before docker build.
          - { repo: memos, branch: main, file: scripts/Dockerfile, image: memos, variant: fe-prebuild-1, pre: "corepack enable && cd web && pnpm install --frozen-lockfile && pnpm release" }
          - { repo: sshwifty, branch: master, file: Dockerfile, image: sshwifty }
          - { repo: watchtower, branch: main, file: dockerfiles/Dockerfile.self-contained, image: watchtower }
          - { repo: wud, branch: main, file: Dockerfile, image: wud }
    name: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wxrchn/${{ matrix.repo }}
          ref: ${{ matrix.branch }}

      - name: Source SHA
        id: src
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Skip if already built from this source
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skip=false
          REG="https://ghcr.io/v2/wxrchn/${{ matrix.image }}"
          TOKEN=$(curl -fsSL -u "${{ github.actor }}:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:wxrchn/${{ matrix.image }}:pull" | jq -r '.token // empty' || true)
          if [ -n "$TOKEN" ]; then
            MANIFEST=$(curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.oci.image.index.v1+json" "$REG/manifests/latest" || true)
            CFG=""
            AMD=$(printf '%s' "$MANIFEST" | jq -r 'first(.manifests[]? | select(.platform.architecture == "amd64") | .digest) // empty' 2>/dev/null || true)
            if [ -n "$AMD" ]; then
              CFG=$(curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.oci.image.manifest.v1+json" "$REG/manifests/$AMD" | jq -r '.config.digest // empty' || true)
            else
              CFG=$(printf '%s' "$MANIFEST" | jq -r '.config.digest // empty' 2>/dev/null || true)
            fi
            if [ -n "$CFG" ]; then
              LABELS=$(curl -fsSL -H "Authorization: Bearer $TOKEN" "$REG/blobs/$CFG" | jq -c '.config.Labels // {}' || true)
              REV=$(printf '%s' "$LABELS" | jq -r '."org.opencontainers.image.revision" // empty')
              REC=$(printf '%s' "$LABELS" | jq -r '."io.wxrchn.build-recipe" // empty')
              VAR=$(printf '%s' "$LABELS" | jq -r '."io.wxrchn.build-variant" // empty')
              echo "Existing ghcr.io/wxrchn/${{ matrix.image }}:latest stamp: revision=$REV recipe=$REC variant=$VAR"
              echo "Current source: ${{ steps.src.outputs.full }} recipe=$BUILD_RECIPE variant=${{ matrix.variant }}"
              if [ "$REV" = "${{ steps.src.outputs.full }}" ] && [ "$REC" = "$BUILD_RECIPE" ] && [ "$VAR" = "${{ matrix.variant }}" ]; then
                skip=true
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then echo "No new commits since this image was last built - skipping build."; fi

      - name: Resolve image version
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ -f scripts/release_version.sh ]; then
            echo "IMAGE_VERSION=$(bash scripts/release_version.sh development-version)" >> "$GITHUB_ENV"
          else
            echo "IMAGE_VERSION=dev" >> "$GITHUB_ENV"
          fi

      - name: Compose image tags
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAGS="ghcr.io/wxrchn/${{ matrix.image }}:latest"
          VER=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/wxrchn/${{ matrix.repo }}/releases/latest" | jq -r '.tag_name // empty' || true)
          if [ -n "$VER" ] && [ "$VER" != "null" ]; then
            TAGS="$TAGS
          ghcr.io/wxrchn/${{ matrix.image }}:$VER"
          fi
          { echo "TAGS<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_ENV"
          echo "Tags:"; echo "$TAGS"

      - name: Set up Node.js for pre-build
        if: ${{ matrix.pre != '' && steps.check.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pre-build step
        if: ${{ matrix.pre != '' && steps.check.outputs.skip != 'true' }}
        run: ${{ matrix.pre }}

      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: ${{ matrix.context || '.' }}
          file: ./${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            COMMIT=${{ steps.src.outputs.sha }}
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.revision=${{ steps.src.outputs.full }}
            io.wxrchn.build-recipe=${{ env.BUILD_RECIPE }}
            io.wxrchn.build-variant=${{ matrix.variant }}

  # nginx-proxy-manager is not built from source (its image needs a frontend
  # pre-build); mirror the official Docker Hub image to GHCR instead.
  mirror:
    runs-on: ubuntu-latest
    name: nginx-proxy-manager (mirror)
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror jc21/nginx-proxy-manager to GHCR
        run: |
          set -e
          digest_of() {
            local raw
            raw=$(docker buildx imagetools inspect "$1" --raw 2>/dev/null) || { echo ""; return; }
            if [ -z "$raw" ]; then echo ""; return; fi
            if printf '%s' "$raw" | jq -e '.manifests' >/dev/null 2>&1; then
              printf '%s' "$raw" | jq -r '[.manifests[] | select(.platform.architecture != "unknown") | .digest] | unique | join(",")'
            else
              printf 'sha256:%s' "$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
            fi
          }
          VER=$(curl -fsSL "https://hub.docker.com/v2/repositories/jc21/nginx-proxy-manager/tags?page_size=100&ordering=last_updated" | jq -r '[.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first // empty')
          UP_L=$(digest_of jc21/nginx-proxy-manager:latest)
          OUR_L=$(digest_of ghcr.io/wxrchn/nginx-proxy-manager:latest)
          changed=true
          if [ -n "$UP_L" ] && [ "$UP_L" = "$OUR_L" ]; then
            changed=false
            if [ -n "$VER" ]; then
              UP_V=$(digest_of "jc21/nginx-proxy-manager:$VER")
              OUR_V=$(digest_of "ghcr.io/wxrchn/nginx-proxy-manager:$VER")
              if [ -z "$UP_V" ] || [ "$UP_V" != "$OUR_V" ]; then changed=true; fi
            fi
          fi
          if [ "$changed" = "false" ]; then
            echo "Upstream image unchanged - skipping mirror."
            exit 0
          fi
          docker buildx imagetools create -t ghcr.io/wxrchn/nginx-proxy-manager:latest jc21/nginx-proxy-manager:latest
          if [ -n "$VER" ]; then
            docker buildx imagetools create -t "ghcr.io/wxrchn/nginx-proxy-manager:$VER" "jc21/nginx-proxy-manager:$VER"
            echo "Mirrored latest and $VER"
          else
            echo "Mirrored latest only (no version tag resolved)"
          fi

  # sun-panel is not built from source either (wxr's call, 2026-10-28:
  # take upstream's published package instead of building); mirror the
  # official Docker Hub image to GHCR, like nginx-proxy-manager.
  mirror-sun-panel:
    runs-on: ubuntu-latest
    name: sun-panel (mirror)
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror hslr/sun-panel to GHCR
        run: |
          set -e
          plat_digests() {
            docker buildx imagetools inspect "$1" --raw 2>/dev/null | jq -r '[.manifests[]? | select(.platform.architecture != "unknown") | .digest] | unique | join(",")' || echo ""
          }
          tag_unchanged() {
            local up our
            up=$(plat_digests "hslr/sun-panel:$1")
            our=$(plat_digests "ghcr.io/wxrchn/sun-panel:$1")
            [ -n "$up" ] && [ "$up" = "$our" ]
          }
          # GHCR rejects the attestation manifests bundled in the upstream
          # OCI index (403 on the unknown-architecture entries), so copy
          # only the real platform manifests into a fresh index.
          copy_tag() {
            local src="hslr/sun-panel:$1" dst="ghcr.io/wxrchn/sun-panel:$1"
            local digests args=""
            digests=$(docker buildx imagetools inspect "$src" --raw | jq -r '[.manifests[] | select(.platform.architecture != "unknown") | .digest] | unique | .[]')
            for d in $digests; do args="$args docker.io/hslr/sun-panel@$d"; done
            docker buildx imagetools create -t "$dst" $args
          }
          # Beta only (wxr, 2026-11-03): mirror just the floating beta tag
          # and the versioned beta tag it currently points at (same digest),
          # e.g. beta = 2.0.2-beta261101. The stable line (latest / 1.8.1) is
          # no longer mirrored - wxr wants only the newest beta versions.
          TAGS_JSON=$(curl -fsSL "https://hub.docker.com/v2/repositories/hslr/sun-panel/tags?page_size=100")
          BETA_DIGEST=$(printf '%s' "$TAGS_JSON" | jq -r '[.results[] | select(.name == "beta") | .digest] | first // empty')
          BETA_VER=""
          if [ -n "$BETA_DIGEST" ]; then
            BETA_VER=$(printf '%s' "$TAGS_JSON" | jq -r --arg d "$BETA_DIGEST" '[.results[] | select(.digest == $d and (.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+-beta[0-9]+$"))) | .name] | first // empty')
          fi
          if [ -z "$BETA_DIGEST" ]; then
            echo "No beta tag found upstream - nothing to mirror."
            exit 0
          fi
          CANDIDATES="beta $BETA_VER"
          changed=""
          for t in $CANDIDATES; do
            [ -n "$t" ] || continue
            if ! tag_unchanged "$t"; then changed="$changed $t"; fi
          done
          if [ -z "$changed" ]; then
            echo "Upstream image unchanged - skipping mirror."
            exit 0
          fi
          for t in $changed; do copy_tag "$t"; done
          echo "Mirrored:$changed"

  # rustdesk-server-s6 is mirrored, not built from source (wxr's call,
  # 2026-11-02): the fork's Dockerfile expects the hbbs/hbbr release binaries
  # to be dropped into the build context by hand, so a clean-checkout build
  # silently produced an image without them (2026-11-02 audit). Mirror
  # lejianwen's official GHCR package instead, like sun-panel.
  mirror-rustdesk:
    runs-on: ubuntu-latest
    name: rustdesk-server-s6 (mirror)
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror lejianwen/rustdesk-server-s6 to GHCR
        run: |
          set -e
          plat_digests() {
            docker buildx imagetools inspect "$1" --raw 2>/dev/null | jq -r '[.manifests[]? | select(.platform.architecture != "unknown") | .digest] | unique | join(",")' || echo ""
          }
          tag_unchanged() {
            local up our
            up=$(plat_digests "ghcr.io/lejianwen/rustdesk-server-s6:$1")
            our=$(plat_digests "ghcr.io/wxrchn/rustdesk-server-s6:$1")
            [ -n "$up" ] && [ "$up" = "$our" ]
          }
          # Copy only the real platform manifests into a fresh index, the
          # same approach as the sun-panel mirror.
          copy_tag() {
            local src="ghcr.io/lejianwen/rustdesk-server-s6:$1" dst="ghcr.io/wxrchn/rustdesk-server-s6:$1"
            local digests args=""
            digests=$(docker buildx imagetools inspect "$src" --raw | jq -r '[.manifests[] | select(.platform.architecture != "unknown") | .digest] | unique | .[]')
            for d in $digests; do args="$args ghcr.io/lejianwen/rustdesk-server-s6@$d"; done
            docker buildx imagetools create -t "$dst" $args
          }
          TOK=$(curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:lejianwen/rustdesk-server-s6:pull" | jq -r '.token // empty')
          VER=$(curl -fsSL -H "Authorization: Bearer $TOK" "https://ghcr.io/v2/lejianwen/rustdesk-server-s6/tags/list" | jq -r '[.tags[] | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last // empty')
          skip=true
          if ! tag_unchanged latest; then skip=false; fi
          if [ -n "$VER" ] && ! tag_unchanged "$VER"; then skip=false; fi
          if [ "$skip" = "true" ]; then
            echo "Upstream image unchanged - skipping mirror."
            exit 0
          fi
          copy_tag latest
          if [ -n "$VER" ]; then
            copy_tag "$VER"
            echo "Mirrored latest and $VER"
          else
            echo "Mirrored latest only (no version tag resolved)"
          fi
