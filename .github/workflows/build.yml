name: Build fork images

# Builds container images from wxrchn's forks (default branches) and pushes
# them to GHCR under ghcr.io/wxrchn/*. Runs weekly on Mondays 02:00 UTC
# (10:00 Asia/Shanghai), after the weekly fork sync, or manually.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: 3x-ui, branch: main, file: Dockerfile, image: 3x-ui }
          - { repo: LunaTV, branch: main, file: Dockerfile, image: lunatv }
          - { repo: dockge, branch: master, file: docker/Dockerfile, image: dockge }
          - { repo: filebrowser, branch: main, file: _docker/Dockerfile, image: filebrowser }
          - { repo: frp, branch: dev, file: dockerfiles/Dockerfile-for-frpc, image: frpc }
          - { repo: frp, branch: dev, file: dockerfiles/Dockerfile-for-frps, image: frps }
          - { repo: memos, branch: main, file: scripts/Dockerfile, image: memos }
          - { repo: sun-panel, branch: master, file: Dockerfile, image: sun-panel }
          - { repo: watchtower, branch: main, file: dockerfiles/Dockerfile.self-contained, image: watchtower }
          - { repo: wud, branch: main, file: Dockerfile, image: wud }
    name: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wxrchn/${{ matrix.repo }}
          ref: ${{ matrix.branch }}

      - name: Source short SHA
        id: src
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pre-build step
        if: ${{ matrix.pre != '' }}
        run: ${{ matrix.pre }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/wxrchn/${{ matrix.image }}:latest
            ghcr.io/wxrchn/${{ matrix.image }}:sha-${{ steps.src.outputs.sha }}

  # nginx-proxy-manager is not built from source (its image needs a frontend
  # pre-build); mirror the official Docker Hub image to GHCR instead.
  mirror:
    runs-on: ubuntu-latest
    name: nginx-proxy-manager (mirror)
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror jc21/nginx-proxy-manager to GHCR
        run: |
          set -e
          docker buildx imagetools create -t ghcr.io/wxrchn/nginx-proxy-manager:latest jc21/nginx-proxy-manager:latest
          VER=$(curl -fsSL "https://hub.docker.com/v2/repositories/jc21/nginx-proxy-manager/tags?page_size=100&ordering=last_updated" | jq -r '[.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first // empty')
          if [ -n "$VER" ]; then
            docker buildx imagetools create -t "ghcr.io/wxrchn/nginx-proxy-manager:$VER" "jc21/nginx-proxy-manager:$VER"
            echo "Mirrored latest and $VER"
          else
            echo "Mirrored latest only (no version tag resolved)"
          fi
