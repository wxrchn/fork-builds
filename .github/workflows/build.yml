name: Build fork images

# Builds container images from wxrchn's forks (default branches) and pushes
# them to GHCR under ghcr.io/wxrchn/*. Runs weekly on Mondays 02:00 UTC
# (10:00 Asia/Shanghai), after the weekly fork sync, or manually.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: 3x-ui, branch: main, file: Dockerfile, image: 3x-ui }
          - { repo: LunaTV, branch: main, file: Dockerfile, image: lunatv }
          - { repo: dockge, branch: master, file: docker/Dockerfile, image: dockge }
          - { repo: filebrowser, branch: main, file: _docker/Dockerfile, image: filebrowser }
          - { repo: frp, branch: dev, file: dockerfiles/Dockerfile-for-frpc, image: frpc }
          - { repo: frp, branch: dev, file: dockerfiles/Dockerfile-for-frps, image: frps }
          - { repo: memos, branch: main, file: scripts/Dockerfile, image: memos }
          - { repo: rustdesk-server, branch: forapi, file: docker/Dockerfile, image: rustdesk-server-s6 }
          - { repo: sshwifty, branch: master, file: Dockerfile, image: sshwifty }
          - { repo: sun-panel, branch: master, file: Dockerfile, image: sun-panel }
          - { repo: watchtower, branch: main, file: dockerfiles/Dockerfile.self-contained, image: watchtower }
          - { repo: wud, branch: main, file: Dockerfile, image: wud }
    name: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wxrchn/${{ matrix.repo }}
          ref: ${{ matrix.branch }}

      - name: Source short SHA
        id: src
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve image version
        run: |
          if [ -f scripts/release_version.sh ]; then
            echo "IMAGE_VERSION=$(bash scripts/release_version.sh development-version)" >> "$GITHUB_ENV"
          else
            echo "IMAGE_VERSION=dev" >> "$GITHUB_ENV"
          fi

      - name: Compose image tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAGS="ghcr.io/wxrchn/${{ matrix.image }}:latest"
          VER=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/wxrchn/${{ matrix.repo }}/releases/latest" | jq -r '.tag_name // empty' || true)
          if [ -n "$VER" ] && [ "$VER" != "null" ]; then
            TAGS="$TAGS
          ghcr.io/wxrchn/${{ matrix.image }}:$VER"
          fi
          { echo "TAGS<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_ENV"
          echo "Tags:"; echo "$TAGS"

      - name: Approve pnpm build scripts (sun-panel)
        if: ${{ matrix.repo == 'sun-panel' }}
        run: |
          python3 - <<'PYEOF'
          import pathlib
          # pnpm v10 reads build approvals from pnpm-workspace.yaml (the
          # package.json "pnpm" field is ignored) and this repo has none:
          # create it, and patch the Dockerfile copy to bring it into /build
          # before `pnpm install` runs. Only the build workspace is changed.
          pathlib.Path("pnpm-workspace.yaml").write_text(
              "onlyBuiltDependencies:\n  - esbuild\n  - vue-demi\n")
          d = pathlib.Path("Dockerfile")
          t = d.read_text()
          anchor = "COPY ./pnpm-lock.yaml /build"
          assert anchor in t, "Dockerfile anchor not found"
          t = t.replace(anchor, anchor + "\n\nCOPY ./pnpm-workspace.yaml /build", 1)
          d.write_text(t)
          print("created pnpm-workspace.yaml; Dockerfile patched")
          PYEOF

      - name: Make s6-overlay arch-aware (rustdesk-server)
        if: matrix.repo == 'rustdesk-server'
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('docker/Dockerfile')
          t = p.read_text()
          stage = (
              'FROM alpine:3 AS s6dl\n'
              'ARG TARGETARCH\n'
              'ARG S6_OVERLAY_VERSION=3.2.0.0\n'
              'RUN case "$TARGETARCH" in amd64) A=x86_64 ;; arm64) A=aarch64 ;; arm) A=armhf ;; *) A=x86_64 ;; esac && \\\n'
              '    wget -q "https://github.com/just-containers/s6-overlay/releases/download/v${S6_OVERLAY_VERSION}/s6-overlay-noarch.tar.xz" -O /tmp/s6-overlay-noarch.tar.xz && \\\n'
              '    wget -q "https://github.com/just-containers/s6-overlay/releases/download/v${S6_OVERLAY_VERSION}/s6-overlay-${A}.tar.xz" -O /tmp/s6-overlay-arch.tar.xz\n'
              '\n'
          )
          lines = []
          for ln in t.splitlines():
              if ln.strip() == 'ARG S6_ARCH=x86_64':
                  continue
              if ln.startswith('ADD ') and 's6-overlay-noarch.tar.xz' in ln:
                  ln = 'COPY --from=s6dl /tmp/s6-overlay-noarch.tar.xz /tmp/s6-overlay-noarch.tar.xz'
              elif ln.startswith('ADD ') and '${S6_ARCH}' in ln:
                  ln = 'COPY --from=s6dl /tmp/s6-overlay-arch.tar.xz /tmp/s6-overlay-arch.tar.xz'
              elif '${S6_ARCH}' in ln:
                  ln = ln.replace('s6-overlay-${S6_ARCH}.tar.xz', 's6-overlay-arch.tar.xz')
              lines.append(ln)
          out = stage + '\n'.join(lines) + '\n'
          assert 's6dl' in out and 'S6_ARCH=x86_64' not in out and '${S6_ARCH}' not in out, 'patch failed'
          p.write_text(out)
          print('patched docker/Dockerfile for per-arch s6-overlay')
          PYEOF

      - name: Pre-build step
        if: ${{ matrix.pre != '' }}
        run: ${{ matrix.pre }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.file }}
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            COMMIT=${{ steps.src.outputs.sha }}
          tags: ${{ env.TAGS }}

  # nginx-proxy-manager is not built from source (its image needs a frontend
  # pre-build); mirror the official Docker Hub image to GHCR instead.
  mirror:
    runs-on: ubuntu-latest
    name: nginx-proxy-manager (mirror)
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror jc21/nginx-proxy-manager to GHCR
        run: |
          set -e
          docker buildx imagetools create -t ghcr.io/wxrchn/nginx-proxy-manager:latest jc21/nginx-proxy-manager:latest
          VER=$(curl -fsSL "https://hub.docker.com/v2/repositories/jc21/nginx-proxy-manager/tags?page_size=100&ordering=last_updated" | jq -r '[.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first // empty')
          if [ -n "$VER" ]; then
            docker buildx imagetools create -t "ghcr.io/wxrchn/nginx-proxy-manager:$VER" "jc21/nginx-proxy-manager:$VER"
            echo "Mirrored latest and $VER"
          else
            echo "Mirrored latest only (no version tag resolved)"
          fi
